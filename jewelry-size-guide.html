<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jewelry Size Guide | Vie Jewels</title>
  <meta name="description" content="Find your perfect fit with the Vie Jewels size guides for rings, bangles and necklaces." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── JEWELRY SIZE GUIDE — same system as the Jewelry Care / Price / Diamond Journey guides ── */
    .guide-hero{padding-top:20px;padding-bottom:22px;text-align:center}
    .guide-hero h1{font-family:var(--font-display);font-size:18px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;max-width:620px;margin:0 auto}
    .guide-hero h1::after{content:"";display:block;width:56px;height:1px;background:#c9b27c;margin:14px auto 0}
    .guide-hero p.guide-subtitle{font-family:var(--font-display);font-style:italic;font-size:14px;letter-spacing:.03em;color:#8a7f69;max-width:560px;margin:8px auto 0}
    @media(max-width:640px){.guide-hero h1{font-size:14px}}
    .guide-content{max-width:960px;margin:0 auto;padding-bottom:40px}
    .guide-text{font-size:13px;color:#6f6a60;line-height:1.8;max-width:760px;margin:0 auto 28px;text-align:center}
    .size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .size-tile{display:block;background:#fff;border:1px solid #e8e1d2;border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(22,20,18,.04);transition:box-shadow var(--transition),transform var(--transition),border-color var(--transition)}
    .size-tile:hover{box-shadow:0 14px 34px rgba(22,20,18,.10);transform:translateY(-2px);border-color:#c9b27c}
    .size-img{aspect-ratio:3/2;background:#fbf8f1;overflow:hidden}
    .size-img img{width:100%;height:100%;object-fit:contain;display:block}
    .size-label{display:block;padding:16px 12px 18px;text-align:center;font-family:var(--font-display);font-size:13px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#2b2823;border-top:1px solid #efe8d8;transition:color var(--transition)}
    .size-tile:hover .size-label{color:#8f7236}
    .guide-back-wrap{text-align:center;margin-top:44px}
    .guide-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#737373;text-decoration:none;transition:color var(--transition)}
    .guide-back:hover{color:#8f7236}
    @media(max-width:760px){.size-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="top-strip">
      <span>Vie Jewels</span>
      <span>Fine Jewelry • Diamonds • Bespoke Designs</span>
    </div>
    <nav class="main-nav">
      <a class="brand" href="index.html"><img src="/assets/logo.svg" alt="Vie Jewels" /></a>
      <div class="nav-links">
        <a href="collections.html">Collections</a>
        <a href="knowledge-lounge.html" aria-current="page">Knowledge Lounge</a>
        <a href="contact.html">Contact Us</a>
      </div>
      <div class="nav-icons">
        <a href="cart.html" aria-label="Shopping Cart">🛒 <span class="nav-badge" data-cart-count style="display:none"></span></a>
        <a href="account.html" aria-label="My Account">◎</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero guide-hero">
      <h1>Jewelry Size Guide</h1>
      <p class="guide-subtitle">Find Your Perfect Fit</p>
    </section>

    <section class="section">
      <div class="guide-content">
        <div class="size-grid">
          <a class="size-tile" href="jewelry-size-ring.html">
            <div class="size-img"><img src="/assets/Ring%20Size-Guide.jpg" alt="Measuring tape for ring sizing" /></div>
            <span class="size-label">Ring</span>
          </a>
          <a class="size-tile" href="jewelry-size-bangle.html">
            <div class="size-img"><img src="/assets/Bangle%20Size%20Guide.jpg" alt="Bangle measured against a ruler" /></div>
            <span class="size-label">Bangle</span>
          </a>
          <a class="size-tile" href="jewelry-size-necklace.html">
            <div class="size-img"><img src="/assets/Necklace%20Size-Guide.jpg" alt="Illustration of necklace lengths" /></div>
            <span class="size-label">Necklace</span>
          </a>
        </div>

        <div class="guide-back-wrap">
          <a class="guide-back" href="jewelry-guide.html">&larr; Back to Jewelry Guide</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="contact" class="site-footer">
    <div>
      <h2>VIE JEWELS</h2>
      <p>Jewels for life</p>
    </div>
    <div>
      <h3>Contact Us</h3>
      <p>Email: hello@viejewels.com</p>
      <p>Website: <a href="https://www.viejewels.com">www.viejewels.com</a></p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
