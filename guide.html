<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide | Vie Jewels</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── GUIDE PAGE — long-form editorial template ────────────────────
       One template renders every guide (Diamond Guide, Jewelry Guide,
       Gemstone Guide, etc.) from data in Supabase. Adding a new guide
       never requires a new page or new CSS — only a new row.
    ──────────────────────────────────────────────────────────────── */

    .guide-hero {
      height: 46vh;
      min-height: 320px;
      max-height: 460px;
      background-size: cover;
      background-position: center;
      background-color: var(--surface2);
      position: relative;
      display: flex;
      align-items: flex-end;
    }
    .guide-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,9,8,0.05) 0%, rgba(10,9,8,0.55) 100%);
    }
    .guide-hero-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 40px 44px;
      text-align: center;
      width: 100%;
    }
    .guide-hero-content .eyebrow { color: var(--accent-light); }
    .guide-hero-content h1 {
      font-family: var(--font-display);
      font-size: 46px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 0.01em;
      margin-bottom: 10px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .guide-hero-content p {
      color: rgba(255,255,255,0.85);
      font-size: 15px;
    }
    /* No-image fallback header (matches existing .page-hero) */
    .guide-header-plain { padding: 48px 40px 32px; text-align: center; border-bottom: 1px solid var(--border-light); }
    .guide-header-plain h1 { font-family: var(--font-display); font-size: 45px; font-weight: 300; margin-bottom: 12px; }
    .guide-header-plain p { color: var(--text-muted); font-size: 14px; }

    .guide-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 40px 24px;
      display: flex;
      flex-direction: column;
      gap: 56px;
    }

    .guide-block-text h2,
    .guide-block-image-text h2,
    .guide-stat-grid-wrap h2,
    .guide-accordion-wrap h2 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 300;
      margin-bottom: 14px;
      letter-spacing: 0.01em;
    }
    .guide-block-text p,
    .guide-block-image-text p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.9;
    }

    /* Alternating image/text block */
    .guide-block-image-text {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }
    .guide-block-image-text.reverse .guide-block-image { order: 2; }
    .guide-block-image-text.reverse .guide-block-copy { order: 1; }
    .guide-block-image {
      aspect-ratio: 4 / 5;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface2);
    }
    .guide-block-image img { width: 100%; height: 100%; object-fit: cover; }

    /* Pull quote — reuses the gold-hairline treatment already established
       for .cart-intro-emphasis elsewhere on the site, so the "signature
       moment" of a guide page is consistent with the rest of the brand
       rather than introducing a new competing motif. */
    .guide-pull-quote {
      position: relative;
      text-align: center;
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: 22px;
      line-height: 1.65;
      color: var(--text);
      max-width: 560px;
      margin: 8px auto;
      padding-top: 32px;
    }
    .guide-pull-quote::before {
      content: "";
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 1px;
      background: var(--accent);
    }
    .guide-pull-quote cite {
      display: block;
      margin-top: 18px;
      font-family: var(--font);
      font-style: normal;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    /* Stat grid (e.g. the 4Cs) */
    .guide-stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1px;
      background: var(--border-light);
      border: 1px solid var(--border-light);
      margin-top: 20px;
    }
    .guide-stat {
      background: var(--surface);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .guide-stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .guide-stat-value {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 400;
      color: var(--text);
    }
    .guide-stat-body { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

    /* Accordion (FAQ) */
    .guide-accordion { border-top: 1px solid var(--border-light); margin-top: 16px; }
    .guide-accordion-item { border-bottom: 1px solid var(--border-light); }
    .guide-accordion-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 4px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: var(--font);
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
    }
    .guide-accordion-icon {
      flex-shrink: 0;
      font-size: 16px;
      color: var(--accent);
      transition: transform var(--transition);
    }
    .guide-accordion-q.open .guide-accordion-icon { transform: rotate(45deg); }
    .guide-accordion-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--transition);
    }
    .guide-accordion-a p {
      padding: 0 4px 18px;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    /* Gallery row */
    .guide-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
    .guide-gallery-item { aspect-ratio: 1 / 1; border-radius: var(--radius); overflow: hidden; background: var(--surface2); }
    .guide-gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .guide-divider { border: none; border-top: 1px solid var(--border-light); margin: 0; }

    /* Related guides strip */
    .guide-related-section { max-width: 1100px; margin: 24px auto 0; padding: 0 40px 64px; }
    .guide-related-section h3 {
      font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-light); text-align: center; margin-bottom: 24px;
    }
    .guide-related-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

    @media (max-width: 720px) {
      .guide-block-image-text { grid-template-columns: 1fr; gap: 20px; }
      .guide-block-image-text.reverse .guide-block-image,
      .guide-block-image-text.reverse .guide-block-copy { order: initial; }
      .guide-hero-content h1 { font-size: 32px; }
      .guide-body { padding: 40px 24px 16px; gap: 44px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="top-strip">
      <span>Vie Jewels</span>
      <span>Fine Jewelry • Diamonds • Bespoke Designs</span>
    </div>

    <nav class="main-nav">
      <a class="brand" href="index.html"><img src="/assets/logo.svg" alt="Vie Jewels" /></a>

      <div class="nav-links">
        <a href="world-of-vie.html">World of Vie</a>
        <a href="collections.html">Collections</a>
        <a href="knowledge-lounge.html" aria-current="page">Knowledge Lounge</a>
        <a href="contact.html">Contact Us</a>
      </div>

      <div class="nav-icons">
        <a href="cart.html" aria-label="Shopping Cart">🛒 <span class="nav-badge" data-cart-count style="display:none"></span></a>
        <a href="account.html" aria-label="My Account">◎</a>
      </div>
    </nav>
  </header>

  <main data-guide-detail>

    <!-- HERO (image) — shown/hidden by guides.js depending on hero_image -->
    <section class="guide-hero" data-guide-hero style="display:none">
      <div class="guide-hero-content">
        <p class="eyebrow" data-guide-eyebrow>Knowledge Lounge</p>
        <h1 data-guide-title>Loading&hellip;</h1>
        <p data-guide-subtitle></p>
      </div>
    </section>

    <!-- Plain header shown only while loading / if no hero image -->
    <section class="guide-header-plain" data-guide-header-plain>
      <p class="eyebrow" data-guide-eyebrow>Knowledge Lounge</p>
      <h1 data-guide-title>Loading&hellip;</h1>
      <p data-guide-subtitle></p>
    </section>

    <!-- Content blocks render here from Supabase `sections` jsonb -->
    <div class="guide-body" data-guide-body></div>

    <!-- Related guides -->
    <section class="guide-related-section">
      <h3>Continue Reading</h3>
      <div class="guide-related-grid" data-guide-related></div>
    </section>

  </main>

  <footer id="contact" class="site-footer">
    <div>
      <h2>VIE JEWELS</h2>
      <p>Jewels for life</p>
    </div>
    <div>
      <h3>Contact Us</h3>
      <p>Email: hello@viejewels.com</p>
      <p>Website: www.viejewels.com</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="guides.js"></script>
  <script>
    // Toggle between the image-hero header and the plain header — whichever
    // fits the guide's data. guides.js sets data-guide-hero's display:block
    // when hero_image exists; we mirror that onto the plain header here.
    const _guideHeroObserver = new MutationObserver(() => {
      const hasImage = document.querySelector('[data-guide-hero]').style.display !== 'none';
      document.querySelector('[data-guide-header-plain]').style.display = hasImage ? 'none' : '';
    });
    _guideHeroObserver.observe(document.querySelector('[data-guide-hero]'), { attributes: true, attributeFilter: ['style'] });
  </script>
</body>
</html>
